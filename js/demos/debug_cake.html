<!DOCTYPE html>
<html>
<head>
    <title>Debug Cake Loading</title>
    <style>
        body { margin: 0; font-family: monospace; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; max-width: 500px; z-index: 100; }
        #canvas-container { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <div id="info">Loading...</div>
    <div id="canvas-container"></div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
        import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
        
        const info = document.getElementById('info');
        const container = document.getElementById('canvas-container');
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 6);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        
        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const directional = new THREE.DirectionalLight(0xffffff, 0.8);
        directional.position.set(5, 10, 7.5);
        scene.add(directional);
        
        // Load materials first
        const mtlLoader = new MTLLoader();
        mtlLoader.load('separatedCake.mtl', (materials) => {
            info.innerHTML += '<br>Materials loaded: ' + Object.keys(materials.materials).join(', ');
            materials.preload();
            
            // Load OBJ
            const objLoader = new OBJLoader();
            objLoader.setMaterials(materials);
            objLoader.load('separatedCake.obj', (root) => {
                info.innerHTML += '<br><br>OBJ loaded successfully!';
                info.innerHTML += '<br>Root children: ' + root.children.length;
                
                let meshInfo = '';
                root.children.forEach((child, i) => {
                    if (child instanceof THREE.Mesh) {
                        const vertices = child.geometry.attributes.position?.count || 0;
                        meshInfo += `<br>${i}: ${child.name} - ${vertices} vertices`;
                        
                        // Color code meshes based on vertex count for debugging
                        if (vertices === 0) {
                            child.material = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
                        } else if (vertices < 100) {
                            child.material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
                        } else {
                            child.material = new THREE.MeshBasicMaterial({ color: 0x0088ff, wireframe: true });
                        }
                    }
                });
                
                info.innerHTML += meshInfo;
                
                scene.add(root);
                
                // Frame the object
                const box = new THREE.Box3().setFromObject(root);
                const sphere = box.getBoundingSphere(new THREE.Sphere());
                const center = box.getCenter(new THREE.Vector3());
                
                root.position.sub(center);
                
                const radius = sphere.radius;
                camera.position.set(0, radius * 1.2, radius * 3);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
                
            }, undefined, (error) => {
                info.innerHTML += '<br>Error loading OBJ: ' + error;
            });
            
        }, undefined, (error) => {
            info.innerHTML += '<br>Error loading MTL: ' + error;
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
