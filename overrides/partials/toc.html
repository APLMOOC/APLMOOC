<nav class="md-nav md-nav--secondary apl-feedback-nav" aria-label="Feedback">
  <label class="md-nav__title">Feedback</label>
  <form class="apl-feedback" data-section="{{ page.title | e }}">
    <p class="apl-feedback__where">{{ page.title }}</p>
    <textarea aria-label="Course feedback" class="apl-feedback__message" rows="4" maxlength="2000" required
              placeholder="Spotted a mistake? Something unclear?"></textarea>
    <input aria-label="Email address (optional)" class="apl-feedback__email" type="email" maxlength="200" autocomplete="email"
           placeholder="Email (optional)">
    <button class="apl-feedback__send" type="submit">Send</button>
    <p class="apl-feedback__status" role="status"></p>
  </form>
</nav>
